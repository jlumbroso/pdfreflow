[package]
name = "pdfreflow"
version = "0.1.0"
edition = "2024"
description = "Turn a two-column PDF into single-column pages that are easy to read on a phone."
repository = "https://github.com/jlumbroso/pdfreflow"
# No `license` field yet, and not publishable: ADR-0001 QST-LICENSE is open.
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
